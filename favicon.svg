<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 深色背景 -->
  <rect width="100" height="100" rx="20" fill="#212121"/>
  <!-- 手绘感外圈 — 不是完美圆形，而是歪歪扭扭的椭圆 -->
  <path d="M18 52 C15 28 30 12 50 12 C75 10 85 28 85 50 C87 72 70 88 50 88 C28 90 15 75 18 52" 
        stroke="#E35342" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 左眼 — 手绘小圆点 -->
  <circle cx="37" cy="42" r="4" fill="#E35342"/>
  <!-- 右眼 — 稍微歪一点 -->
  <circle cx="63" cy="40" r="4.5" fill="#E35342"/>
  <!-- 微笑 — 手绘弧线，带点抖动感 -->
  <path d="M30 58 Q38 72 50 72 Q62 72 72 58" 
        stroke="#E35342" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 涂鸦腮红线 — 左边 -->
  <path d="M25 50 Q22 52 24 54" stroke="#E35342" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- 涂鸦腮红线 — 右边 -->
  <path d="M76 48 Q79 50 77 52" stroke="#E35342" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>